[project]
name = "auto-bidding-system"
version = "0.1.0"
description = "Система автобиддинга RTB-аукционов с UCB и контролем бюджета"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit==4.7.0",
    "ruff==0.17.2",
]

[tool.uv]
package = false

[tool.ruff]
required-version = "==0.17.2"
target-version = "py311"
line-length = 100
extend-exclude = ["data", "models", "artifacts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
